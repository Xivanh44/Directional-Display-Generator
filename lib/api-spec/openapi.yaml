openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: allergens
    description: Allergen ingredient database
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /allergens/items:
    get:
      operationId: listAllergenItems
      tags: [allergens]
      summary: List allergen items
      description: List all allergen items, optionally filtered by name search
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Search query to filter items by name
      responses:
        "200":
          description: List of allergen items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AllergenItem"
    post:
      operationId: createAllergenItem
      tags: [allergens]
      summary: Create allergen item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AllergenItemInput"
      responses:
        "201":
          description: Created allergen item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllergenItem"
  /allergens/items/{id}:
    put:
      operationId: updateAllergenItem
      tags: [allergens]
      summary: Update allergen item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AllergenItemInput"
      responses:
        "200":
          description: Updated allergen item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllergenItem"
    delete:
      operationId: deleteAllergenItem
      tags: [allergens]
      summary: Delete allergen item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AllergenItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        lait:
          type: boolean
        cereales:
          type: boolean
        fruits_coque:
          type: boolean
        poisson:
          type: boolean
        mollusques:
          type: boolean
        crustaces:
          type: boolean
        celeri:
          type: boolean
        oeufs:
          type: boolean
        moutarde:
          type: boolean
        sesame:
          type: boolean
        soja:
          type: boolean
        sulfites:
          type: boolean
        lupin:
          type: boolean
        arachide:
          type: boolean
      required:
        - id
        - name
        - lait
        - cereales
        - fruits_coque
        - poisson
        - mollusques
        - crustaces
        - celeri
        - oeufs
        - moutarde
        - sesame
        - soja
        - sulfites
        - lupin
        - arachide
    AllergenItemInput:
      type: object
      properties:
        name:
          type: string
        lait:
          type: boolean
        cereales:
          type: boolean
        fruits_coque:
          type: boolean
        poisson:
          type: boolean
        mollusques:
          type: boolean
        crustaces:
          type: boolean
        celeri:
          type: boolean
        oeufs:
          type: boolean
        moutarde:
          type: boolean
        sesame:
          type: boolean
        soja:
          type: boolean
        sulfites:
          type: boolean
        lupin:
          type: boolean
        arachide:
          type: boolean
      required:
        - name
        - lait
        - cereales
        - fruits_coque
        - poisson
        - mollusques
        - crustaces
        - celeri
        - oeufs
        - moutarde
        - sesame
        - soja
        - sulfites
        - lupin
        - arachide
