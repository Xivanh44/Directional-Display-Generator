name: Deploy apps to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Affichages Hotel
        run: pnpm --filter @workspace/hotel-signage run build
        env:
          PORT: 4173
          BASE_PATH: /Directional-Display-Generator/

      - name: Prepare site root
        run: |
          mkdir -p site
          cp -R artifacts/hotel-signage/dist/public/* site/

      - name: Build Allergenes Cocktail
        run: pnpm --filter @workspace/allergen-app run build
        env:
          PORT: 4174
          BASE_PATH: /Directional-Display-Generator/allergenes-cocktail/

      - name: Add Allergenes Cocktail to site
        run: |
          mkdir -p site/allergenes-cocktail
          cp -R artifacts/allergen-app/dist/public/* site/allergenes-cocktail/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
